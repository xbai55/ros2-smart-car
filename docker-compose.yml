services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-patrol-postgres
    environment:
      POSTGRES_USER: smartpatrol
      POSTGRES_PASSWORD: smartpatrol
      POSTGRES_DB: smartpatrol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpatrol"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-patrol-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: smart-patrol-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartpatrol
      MINIO_ROOT_PASSWORD: smartpatrol123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: