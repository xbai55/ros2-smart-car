decision_controller:
  ros__parameters:
    scan_topic: /scan
    detection_topic: /vision/detection
    lane_offset_topic: /lane/offset
    map_topic: /map
    manual_cmd_topic: /manual_cmd
    cmd_vel_topic: /cmd_vel
    mode_topic: /robot/mode
    emergency_stop_topic: /robot/emergency_stop
    speed_scale_topic: /robot/speed_scale
    front_angle_deg: 35.0
    front_center_deg: 180.0
    front_distance_percentile: 20.0
    obstacle_stop_distance: 0.45
    obstacle_slow_distance: 0.75
    cruise_speed: 0.28
    slow_speed: 0.12
    turn_speed: 1.0
    lane_kp: 0.9
    max_angular_speed: 1.2
    command_timeout_sec: 0.7
    detection_timeout_sec: 1.5
    lane_timeout_sec: 0.5
    scan_timeout_sec: 0.6
    publish_rate_hz: 20.0

laser_obstacle_monitor:
  ros__parameters:
    scan_topic: /scan
    obstacle_topic: /obstacle/front
    front_angle_deg: 35.0
    front_center_deg: 180.0
    front_distance_percentile: 20.0
    obstacle_distance: 0.45
    publish_rate_hz: 10.0

tcp_command_bridge:
  ros__parameters:
    host: 0.0.0.0
    port: 9999
    manual_cmd_topic: /manual_cmd

yolo11_camera_node:
  ros__parameters:
    camera_source: "0"
    camera_width: 640
    camera_height: 480
    camera_fps: 30.0
    model_path: yolo11s.pt
    device: "0"
    imgsz: 640
    confidence: 0.35
    tracking_confidence: 0.1
    tracker_config: bytetrack.yaml
    inference_rate_hz: 10.0
    detection_topic: /vision/detection
    object_offset_topic: /vision/object_offset
    tracking_target_topic: /vision/tracking_target
    tracking_target_set_topic: /vision/tracking_target/set
    annotated_frame_topic: /vision/annotated_frame
    annotated_jpeg_quality: 72
    camera_buffer_size: 1
    mode_topic: /robot/mode
    active_modes: [auto, object_follow]
    default_command: no_light
    safety_hold_sec: 0.8
    min_frame_brightness: 20.0
    min_frame_contrast: 6.0
    publish_every_sec: 0.1
    person_lock_timeout_sec: 0.8
    person_max_center_jump_ratio: 0.3
    red_ratio_threshold: 0.08
    green_ratio_threshold: 0.08
    class_command_map: '{"stop sign": "stop", "person": "slow", "car": "slow", "truck": "slow", "bus": "slow", "motorcycle": "slow", "bicycle": "slow"}'

mode_manager:
  ros__parameters:
    initial_mode: stop
    mode_topic: /robot/mode
    mode_set_topic: /robot/mode/set
    emergency_stop_topic: /robot/emergency_stop
    emergency_stop_set_topic: /robot/emergency_stop/set
    publish_rate_hz: 5.0

color_tracker_node:
  ros__parameters:
    camera_source: "0"
    mode_topic: /robot/mode
    color_target_topic: /vision/color_target
    tracking_target_topic: /vision/tracking_target
    color_config_topic: /vision/color_config
    tracking_target_set_topic: /vision/tracking_target/set
    lane_offset_topic: /lane/offset
    annotated_frame_topic: /vision/annotated_frame
    annotated_jpeg_quality: 72
    camera_buffer_size: 1
    process_rate_hz: 10.0
    min_area: 500.0
    hsv_low: [35, 60, 60]
    hsv_high: [90, 255, 255]

object_follow_node:
  ros__parameters:
    mode_topic: /robot/mode
    object_offset_topic: /vision/object_offset
    lane_offset_topic: /lane/offset
    offset_timeout_sec: 0.7
    publish_rate_hz: 10.0

system_status_node:
  ros__parameters:
    status_topic: /robot/status
    mode_topic: /robot/mode
    emergency_stop_topic: /robot/emergency_stop
    speed_scale_topic: /robot/speed_scale
    scan_topic: /scan
    detection_topic: /vision/detection
    color_target_topic: /vision/color_target
    lane_offset_topic: /lane/offset
    cmd_vel_topic: /cmd_vel
    front_angle_deg: 35.0
    front_center_deg: 180.0
    front_distance_percentile: 20.0
    scan_timeout_sec: 0.6
    health_window_size: 20
    min_valid_ratio: 0.05
    map_timeout_sec: 5.0
    cmd_vel_timeout_sec: 0.7
    tf_check_period_sec: 0.2
    publish_rate_hz: 5.0

web_app_node:
  ros__parameters:
    host: 0.0.0.0
    port: 8080
    static_dir: /home/jetson/ros2-smart-car/web-console/dist
    status_topic: /robot/status
    mode_set_topic: /robot/mode/set
    manual_cmd_topic: /manual_cmd
    emergency_stop_set_topic: /robot/emergency_stop/set
    speed_scale_topic: /robot/speed_scale
    color_config_topic: /vision/color_config
    annotated_frame_topic: /vision/annotated_frame
    camera_source: "0"
    video_fps: 30.0
    video_target_fps: 20.0
    annotated_stream_fps: 20.0
