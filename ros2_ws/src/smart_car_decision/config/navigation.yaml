# Overrides for the installed nav2_bringup Humble defaults.
# Measure the X3 footprint before deployment. Keep this radius equal to
# web_app_node.navigation_robot_radius (default 0.25 m).
amcl:
  ros__parameters:
    base_frame_id: base_link
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: /scan
    update_min_d: 0.05
    update_min_a: 0.10
controller_server:
  ros__parameters:
    controller_plugins: [FollowPath]
    min_y_velocity_threshold: 0.001
    progress_checker:
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      max_vel_x: 0.18
      max_speed_xy: 0.18
      max_vel_theta: 0.75
      trans_stopped_velocity: 0.03
      acc_lim_x: 0.30
      decel_lim_x: -0.30
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_link
      robot_radius: 0.25
      global_frame: odom
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        combination_method: 1
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_link
      robot_radius: 0.25
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        combination_method: 1
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      tolerance: 0.10
      allow_unknown: false
velocity_smoother:
  ros__parameters:
    max_velocity: [0.18, 0.0, 0.75]
    min_velocity: [-0.18, 0.0, -0.75]
    max_accel: [0.30, 0.0, 1.0]
    max_decel: [-0.30, 0.0, -1.0]
    velocity_timeout: 0.3
